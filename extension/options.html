<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 · AI 回答转 Word</title>
<style>
  :root { --ink:#2a2520; --paper:#faf6ec; --gold:#a8791f; --red:#a8341f; --line:#e2d8c3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); padding:28px 20px 48px;
         font: 14px/1.7 "Microsoft YaHei","PingFang SC",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:#8a7f6d; font-size:12px; margin-bottom:22px; }
  fieldset { border:1px solid var(--line); border-radius:9px; padding:16px 18px 18px;
             margin:0 0 16px; background:#fffdf7; }
  legend { padding:0 6px; font-size:12px; color:var(--gold); font-weight:600; }
  label.f { display:block; font-size:12px; color:#6f6555; margin:10px 0 4px; }
  input[type=text], input[type=password], select {
    width:100%; padding:8px 10px; font-size:13px; font-family:inherit;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--gold); }
  .inline { display:flex; gap:8px; }
  .inline input { flex:1; }
  button { padding:8px 14px; font-size:13px; font-family:inherit; cursor:pointer;
           border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  button:hover { border-color:var(--gold); }
  button.primary { background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600; }
  button.primary:hover { background:#8f6518; }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; }
  .status { font-size:12px; margin-top:12px; min-height:18px; }
  .status.ok { color:#3d6b32; }
  .status.warn { color:#8a6518; }
  .status.bad { color:var(--red); }
  .tip { font-size:12px; color:#8a7f6d; margin-top:6px; }
  .tip code { background:#f2ece0; padding:1px 5px; border-radius:4px; font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>设置</h1>
  <div class="sub">把 AI 回答复制成 Word 能认的格式 —— 排版在服务器上算，浏览器只负责复制。</div>

  <fieldset>
    <legend>服务器</legend>
    <label class="f" for="server">站点地址（末尾不用带斜杠）</label>
    <input type="text" id="server" placeholder="https://你的域名/md2word" autocomplete="off">
    <div class="tip">自建的话填自己的地址；只填域名会自动补 <code>https://</code>。</div>

    <label class="f" for="token">访问令牌</label>
    <div class="inline">
      <input type="password" id="token" placeholder="服务器主人给你的那串字符" autocomplete="off">
      <button id="btnShow" type="button">显示</button>
    </div>
    <div class="tip">令牌只存在本机浏览器里（chrome.storage.sync），不上传到任何地方。</div>
  </fieldset>

  <fieldset>
    <legend>默认排版</legend>
    <label class="f" for="preset">样式预设</label>
    <select id="preset"><option value="">加载中…</option></select>
    <label class="f"><input type="checkbox" id="autoCopy"> 转换后自动写入剪贴板</label>
  </fieldset>

  <div class="row">
    <button class="primary" id="btnSave">保存</button>
    <button id="btnTest">测试连通</button>
  </div>
  <div class="status" id="status"></div>
</div>
<script src="options.js"></script>
</body>
</html>
